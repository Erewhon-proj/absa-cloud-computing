services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: absa_app
      POSTGRES_PASSWORD: absa_local_pw
      POSTGRES_DB: absa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U absa_app"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"     # protocollo
      - "15672:15672"   # UI di management (http://localhost:15672, guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://absa_app:absa_local_pw@postgres:5432/absa
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      QUEUE_NAME: absa.reviews
    ports:
      - "8000:8000"
    healthcheck:
      # python per il check
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build: ./services/worker
    environment:
      DATABASE_URL: postgresql://absa_app:absa_local_pw@postgres:5432/absa
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      QUEUE_NAME: absa.reviews
      # Euristica a parole chiave. Per il modello reale: docker-compose.pyabsa.yml
      MODEL_MODE: mock
      # MOCK_DELAY: "2"         # costo simulato per batch, per vedere lo scaling
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./services/frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
