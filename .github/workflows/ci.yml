name: CI/CD Pipeline

# Build & push delle 3 immagini su ECR ad ogni push su main. Il deploy sul
# cluster (kubectl apply) resta un passo separato via `ansible-playbook
# ansible/aws/playbook.yml`: il cluster EKS e' effimero (distrutto a fine
# sessione), quindi un rollout automatico ad ogni commit scriverebbe quasi
# sempre su un cluster che non esiste.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # rilancio manuale dalla pagina Actions, senza nuovo commit

env:
  AWS_REGION: eu-west-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # per l'autenticazione OIDC verso AWS, nessuna chiave statica
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Debug temporaneo: stampa i claim (aud/sub/iss) del token OIDC che GitHub
      # genera, per confrontarli con la trust policy del ruolo IAM. Nessun
      # segreto stampato: solo il payload decodificato, il token grezzo resta
      # nella variabile.
      - name: Debug token OIDC
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          python3 -c "
import base64, json, sys
payload = '$TOKEN'.split('.')[1]
payload += '=' * (-len(payload) % 4)
print(json.dumps(json.loads(base64.urlsafe_b64decode(payload)), indent=2))
" | grep -E '"aud"|"sub"|"iss"|"repository"|"ref"'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ubuntu-latest e' gia' x86_64, come i nodi EKS: nessun --platform da
      # forzare qui (a differenza della build a mano su Mac, che e' ARM).
      - name: Build & push images to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          for svc in api worker frontend; do
            build_args=()
            if [ "$svc" = "worker" ]; then
              build_args=(--build-arg INSTALL_ML=true)
            fi
            docker build "${build_args[@]}" \
              -t "$REGISTRY/absa-$svc:$TAG" \
              -t "$REGISTRY/absa-$svc:latest" \
              "./services/$svc"
            docker push "$REGISTRY/absa-$svc:$TAG"
            docker push "$REGISTRY/absa-$svc:latest"
          done
