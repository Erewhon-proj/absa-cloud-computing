apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: absa-cloud
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: absa-cloud
spec:
  replicas: 1
  # Recreate e non RollingUpdate: il PVC è ReadWriteOnce, quindi un secondo pod
  # non riuscirebbe a montarlo finché il primo è vivo e l'aggiornamento
  # resterebbe bloccato. Qui il vecchio pod muore prima che nasca il nuovo.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: absa-secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-sql
          configMap:
            # creata da ansible/local/playbook.yml a partire da db/init.sql
            name: postgres-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: absa-cloud
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
