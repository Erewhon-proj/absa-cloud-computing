apiVersion: v1
kind: ConfigMap
metadata:
  name: absa-config
  namespace: absa-cloud
data:
  QUEUE_NAME: "absa.reviews"
  MODEL_MODE: "mock" # il modello reale si attiva con k8s/local-pyabsa
  API_URL: "http://api:8000"
  BATCH_SIZE: "16"
  FLUSH_TIMEOUT: "2.0"
  # Costo simulato di un batch di inferenza, in secondi (solo per MODEL_MODE=mock).
  # Senza, il mock è talmente veloce che un worker basta sempre e KEDA non scala
  # mai oltre 1: serve a rendere osservabile l'autoscaling in locale. "0" lo spegne.
  MOCK_DELAY: "2"
---
apiVersion: v1
kind: Secret
metadata:
  name: absa-secret
  namespace: absa-cloud
type: Opaque
stringData:
  POSTGRES_USER: "absa_app"
  POSTGRES_PASSWORD: "absa_local_pw"
  POSTGRES_DB: "absa"
  DATABASE_URL: "postgresql://absa_app:absa_local_pw@postgres:5432/absa"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq.absa-cloud.svc.cluster.local:5672/"
