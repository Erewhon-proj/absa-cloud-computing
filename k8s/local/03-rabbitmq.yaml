apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-pvc
  namespace: absa-cloud
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: absa-cloud
spec:
  replicas: 1
  # Come per Postgres: il PVC è ReadWriteOnce, il pod vecchio deve sparire
  # prima che parta quello nuovo.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      # RabbitMQ salva i dati in una cartella che ha il nome del nodo
      # (rabbit@<hostname>).
      hostname: rabbitmq
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq

          # Timeout esteso a 15 secondi per evitare falsi allarmi.
          # Il comando di ping avvia un processo Erlang che potrebbe richiedere qualche secondo
          # in più quando il worker satura la CPU per caricare il modello PyTorch.
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 15
      volumes:
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: absa-cloud
spec:
  type: LoadBalancer
  ports:
    - name: amqp
      port: 5672
    - name: management
      port: 15672
  selector:
    app: rabbitmq
