apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: absa-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: absa-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: absa-config
            - secretRef:
                name: absa-secret
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: absa-cloud
spec:
  type: LoadBalancer
  ports:
    - port: 8000
  selector:
    app: api
