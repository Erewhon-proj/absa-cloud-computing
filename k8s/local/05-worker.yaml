apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: absa-cloud
spec:
  # Le repliche sono gestite da KEDA (0 -> N). Il valore qui è solo iniziale.
  replicas: 0
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # Il worker esce da solo su SIGTERM, ma solo dopo aver finito e confermato
      # il batch in corso: col mock bastano pochi secondi (col modello reale
      # k8s/local-pyabsa lo porta a 120). Se il grace period scade prima, il
      # kubelet manda SIGKILL e il batch va perso a metà.
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: absa-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: absa-config
            - secretRef:
                name: absa-secret
          # Limiti pensati per il mock. Col modello reale (k8s/local-pyabsa)
          # salgono e in più viene montato il checkpoint.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
  namespace: absa-cloud
spec:
  secretTargetRef:
    - parameter: host
      name: absa-secret
      key: RABBITMQ_URL
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-keda-scaler
  namespace: absa-cloud
spec:
  scaleTargetRef:
    name: worker
  pollingInterval: 10
  cooldownPeriod: 30
  minReplicaCount: 0  # KEDA scala a ZERO se la coda è vuota
  maxReplicaCount: 5
  triggers:
    - type: rabbitmq
      metadata:
        queueName: "absa.reviews"
        mode: "QueueLength"
        value: "30"  # Aggiunge un nuovo pod ogni 30 messaggi in coda
      authenticationRef:
        name: rabbitmq-trigger-auth
