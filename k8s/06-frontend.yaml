apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: absa-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: absa-frontend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: absa-config
          ports:
            - containerPort: 8501
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: absa-cloud
spec:
  type: LoadBalancer
  ports:
    - port: 8501
  selector:
    app: frontend
