# Inizializza lo schema su RDS, in quanto in subnet privata (non raggiungibile)
# motivo per cui il Job girerà DENTRO il cluster.
# Lo script init.sql arriva dalla ConfigMap db-init-sql
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: absa-cloud
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /init/init.sql'
          envFrom:
            - secretRef:
                name: absa-secret
          volumeMounts:
            - name: init
              mountPath: /init
      volumes:
        - name: init
          configMap:
            name: db-init-sql
