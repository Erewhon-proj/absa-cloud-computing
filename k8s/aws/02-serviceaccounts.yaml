# ServiceAccount con annotazione IRSA dove i pod assumono il ruolo IAM via OIDC,
# Gli ARN provengono dagli output Terraform (stack compute).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: absa-api
  namespace: absa-cloud
  annotations:
    eks.amazonaws.com/role-arn: "${API_ROLE_ARN}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: absa-worker
  namespace: absa-cloud
  annotations:
    eks.amazonaws.com/role-arn: "${WORKER_ROLE_ARN}"
