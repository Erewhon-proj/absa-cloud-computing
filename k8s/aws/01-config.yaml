# I valori ${...} vengono risolti a deploy-time da
# scripts/render_manifest.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: absa-config
  namespace: absa-cloud
data:
  QUEUE_BACKEND: "sqs"
  QUEUE_NAME: "absa.reviews"
  MODEL_MODE: "pyabsa" # "mock" per l'euristica a parole chiave, senza modello
  API_URL: "http://api:8000"
  BATCH_SIZE: "10" # SQS consente max 10 messaggi per receive
  AWS_REGION: "${AWS_REGION}"
  SQS_QUEUE_URL: "${SQS_QUEUE_URL}"
  SQS_VISIBILITY_TIMEOUT: "300"
  MODEL_BUCKET: "${S3_MODEL_BUCKET}"
  # Sotto /app (la WORKDIR del container): PyABSA cerca il checkpoint relativo
  # alla working directory e fallisce se sta altrove.
  ABSA_CHECKPOINT: "/app/models/checkpoint"
---
apiVersion: v1
kind: Secret
metadata:
  name: absa-secret
  namespace: absa-cloud
type: Opaque
stringData:
  DATABASE_URL: "${DATABASE_URL}"
