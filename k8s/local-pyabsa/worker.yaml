apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: absa-cloud
spec:
  template:
    spec:
      # Un batch col modello vero su CPU dura molto più che col mock
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          volumeMounts:
            - name: model
              mountPath: /app/models/checkpoint
              readOnly: true
          # Col modello in memoria il worker usa circa 1,2 GB, con picchi vicini ai 2 GB.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            # PyTorch usa più thread: con 2 CPU un batch da 16 impiegava ~95s,
            # con 4 circa 60s.
            limits:
              cpu: "4"
              memory: 3Gi
      volumes:
        - name: model
          hostPath:
            # Percorso assoluto della cartella del checkpoint sul computer.
            # Lo inserisce il playbook (scripts/render_manifest.py).
            path: ${MODEL_DIR}
            type: Directory
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-keda-scaler
  namespace: absa-cloud
spec:
  # Ogni worker tiene in RAM una copia del modello (~2 GB mentre la carica).
  maxReplicaCount: 1
  # Caricare il modello richiede decine di secondi, è opportuno non spegnere il
  # worker appena la coda si svuota.
  cooldownPeriod: 120
